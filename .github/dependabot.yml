# Keep the SHA-pinned GitHub Actions current. scripts/lint.sh action-pins
# requires a full commit SHA on every third-party action, so pins never move
# on their own; Dependabot rewrites the SHA and its version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">godplans plan loop</title>
  <desc id="d">How a plan run works. Orient picks the mode. Ask three to five hard questions. Decide across nineteen domains. Grade with an independent critic. Emit PLAN.mdx. Execute checkbox by checkbox.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="10" fill="#14110E" stroke="#2E2820"/>
  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#1C1814"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#2E2820"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#E8A54B" letter-spacing="1.5">PLAN LOOP</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#A09078" text-anchor="end">NO XP  REAL GATES</text>

  <g transform="translate(36 84)">
    <rect width="176" height="280" rx="4" fill="#1C1814" stroke="#E8A54B"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">1</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Orient</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">Greenfield,</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">brownfield, replan.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">phase 0</text>
  </g>
  <g transform="translate(228 84)">
    <rect width="176" height="280" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">2</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Ask</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">Three to five</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">hard questions.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">discovery</text>
  </g>
  <g transform="translate(420 84)">
    <rect width="176" height="280" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">3</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Decide</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">Nineteen domains.</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">Audit checks invert.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">domain passes</text>
  </g>
  <g transform="translate(612 84)">
    <rect width="176" height="280" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">4</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Grade</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">Independent critic.</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">Pass at 85 of 100.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">phase 6</text>
  </g>
  <g transform="translate(804 84)">
    <rect width="176" height="280" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">5</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Emit</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">PLAN.mdx plus</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">validator companion.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">.godplans/</text>
  </g>
  <g transform="translate(996 84)">
    <rect width="168" height="280" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">6</text>
    <text x="20" y="88" class="sans" font-size="20" font-weight="700" fill="#F5EFE4">Execute</text>
    <text x="20" y="120" class="sans" font-size="13" fill="#A09078">Any agent clears</text>
    <text x="20" y="142" class="sans" font-size="13" fill="#A09078">checkbox tasks.</text>
    <text x="20" y="250" class="mono" font-size="12" fill="#E8A54B">verify cmds</text>
  </g>
</svg>

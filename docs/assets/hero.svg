  <text x="640" y="205" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-weight="600" font-size="128" letter-spacing="4" fill="#F2EBDD">GODPLANS</text>
  <text x="640" y="258" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="30" fill="#F2EBDD">Plan everything before anything.</text>
